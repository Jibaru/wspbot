services:
  web:
    build: .
    restart: unless-stopped
    environment:
      # Next binds to localhost without HOSTNAME, and Traefik then 404s.
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      BOT_MODEL: ${BOT_MODEL}
      BOT_EFFORT: ${BOT_EFFORT}
      DATABASE_URL: ${DATABASE_URL}
      WAPI_BASE_URL: ${WAPI_BASE_URL}
      WAPI_API_KEY: ${WAPI_API_KEY}
      WAPI_WEBHOOK_SECRET: ${WAPI_WEBHOOK_SECRET}
      # Account-level, and only used to reconnect a dropped session. Optional: without it the
      # bot works but cannot bring itself back after the session drops.
      WAPI_PAT: ${WAPI_PAT}
      WAPI_SESSION_ID: ${WAPI_SESSION_ID}
      BOT_REPLY_TO_DMS: ${BOT_REPLY_TO_DMS}
      BOT_IMAGE_MODEL: ${BOT_IMAGE_MODEL}
      # Notion is optional; unset, its tools are simply not offered.
      NOTION_CLIENT_ID: ${NOTION_CLIENT_ID}
      NOTION_CLIENT_SECRET: ${NOTION_CLIENT_SECRET}
      # Used to build the OAuth redirect, so it has to match the integration's registered URI.
      APP_URL: ${APP_URL}
    expose:
      - "3000"
